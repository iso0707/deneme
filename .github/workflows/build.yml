Adı: APK Oluştur

Açık:
  itmek:
    dallar: [ ana ]
  iş akışı_dağıtımı:

İşler:
  inşa etmek:
    runs-on: ubuntu-latest
    Adımlar:
      - uses: actions/checkout@v4

      - isim: Python kurulumu
        uses: actions/setup-python@v5
        ile:
          Python sürümü: '3.11'

      - ad: Sistem bağımlılıklarını yükle
        çalıştır: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - isim: Buildozer'ı yükle
        çalıştır: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - isim: Buildozer ile APK oluşturma
        çalıştır: |
          evet | buildozer android hata ayıklama

      - ad: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        ile:
          isim: kalori-takip-apk
          yol: bin/*.apk
